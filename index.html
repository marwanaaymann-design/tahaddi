<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Lalezar&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>مارو جيم</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;min-height:100vh;
background:radial-gradient(circle at 50% -10%,#1fa36b 0,#0b3d2e 45%,#041a14 100%) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
background:repeating-linear-gradient(90deg,#fff 0 60px,transparent 60px 120px)}
#app{max-width:680px;margin:auto;padding:14px;position:relative;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #fff8}50%{transform:scale(1.04);box-shadow:0 0 22px 6px #fff8}}
@keyframes zoom{0%{transform:scale(.2) rotate(-8deg);opacity:0}60%{transform:scale(1.15) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes glow{0%,100%{text-shadow:0 0 8px #ffd54a}50%{text-shadow:0 0 26px #ffd54a,0 0 40px #ff9800}}
h1{font-size:34px;text-align:center;margin:10px 0;animation:glow 2s infinite;letter-spacing:1px}
h2{text-align:center;margin:8px 0;font-size:24px}
.card{background:linear-gradient(160deg,#ffffff1f,#ffffff0a);border:1px solid #ffffff30;backdrop-filter:blur(4px);border-radius:18px;padding:14px;margin:10px 0}
button{font:inherit;border:0;border-radius:14px;padding:14px;margin:5px 0;background:linear-gradient(180deg,#ffe066,#ffb300);color:#222;font-weight:bold;font-size:17px;cursor:pointer;width:100%;box-shadow:0 5px 0 #b57f00;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b57f00}
button.sec{background:linear-gradient(180deg,#3aa882,#237a5c);color:#fff;box-shadow:0 5px 0 #14503b}
button.bad{background:linear-gradient(180deg,#ef6b6b,#c62828);color:#fff;box-shadow:0 5px 0 #7f1717}
button.good{background:linear-gradient(180deg,#7be07f,#2e9e3a);color:#fff;box-shadow:0 5px 0 #1b6322}
button:disabled{opacity:.4}
button.opt{background:#fff;color:#111;text-align:right;display:flex;gap:10px;align-items:center;box-shadow:0 5px 0 #aaa;font-size:18px;animation:in .4s both}
button.opt b{background:#0b3d2e;color:#fff;border-radius:8px;width:30px;height:30px;line-height:30px;text-align:center;flex:none}
button.opt.good{animation:pulse .6s 2;color:#fff}button.opt.bad{animation:shake .45s;color:#fff}
input,select{font:inherit;padding:12px;border-radius:12px;border:0;width:100%;margin:4px 0}
.score{display:flex;gap:8px;margin:6px 0}
.score div{flex:1;border-radius:14px;padding:8px;text-align:center;transition:.3s;opacity:.7}
.score div.t0{background:linear-gradient(160deg,#2979ff,#1346a8)}.score div.t1{background:linear-gradient(160deg,#ff7043,#b23a14)}
.score div.n{background:#0e4634}
.score .on{opacity:1;transform:scale(1.06);box-shadow:0 0 18px #ffd54a;outline:3px solid #ffd54a}
.score .sc{font-size:30px;font-weight:bold;display:block}.score .sc.pop{animation:pop .5s}
.big{font-size:23px;text-align:center;margin:14px 0;line-height:1.7}
.q{font-size:26px;font-weight:bold}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:20px 8px;text-align:center;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #0006;transition:.15s;animation:zoom .5s both}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 #0006}.tile span{display:block;font-size:44px}
.tile small{display:block;font-size:12px;font-weight:normal;opacity:.9;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{height:92px;font-size:14px;margin:0;animation:zoom .5s both}
.t0{background:linear-gradient(160deg,#2979ff,#1346a8)!important;color:#fff!important}.t1{background:linear-gradient(160deg,#ff7043,#b23a14)!important;color:#fff!important}
.small{opacity:.85;font-size:14px;text-align:center}
.bar{height:12px;background:#0006;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#66bb6a,#ffee58,#ef5350);background-size:300% 100%;transition:width 1s linear}
.timer{font-size:90px;text-align:center;font-weight:bold;animation:glow 1s infinite}.timer.low{color:#ff5252;animation:pulse .5s infinite}
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000d;animation:in .2s}
.splash span{font-size:110px;animation:zoom .6s both}.splash h1{font-size:46px}
.hint{background:#ffffff22;border-radius:12px;padding:10px;margin:6px 0;font-size:19px;animation:zoom .4s both}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:40;animation:fall 2.4s linear forwards;pointer-events:none}
#mute{position:fixed;top:8px;left:8px;width:auto;padding:6px 12px;z-index:70;font-size:18px;margin:0}
.combo{text-align:center;font-size:22px;color:#ffd54a;animation:glow 1s infinite;min-height:30px}
.hostlabel{background:#ffd54a;color:#222;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:bold;width:max-content;margin:0 auto 6px}
.optv{background:#ffffff26;border-radius:12px;padding:12px;margin:6px 0;font-size:19px;display:flex;gap:10px;align-items:center}.optv b{background:#0b3d2e;border-radius:8px;width:30px;height:30px;line-height:30px;text-align:center;flex:none}.optv.good{background:#2e9e3a;animation:pulse .6s 2}
.reveal{background:#000a;border:2px dashed #ffd54a;border-radius:12px;padding:12px;margin:6px 0;font-size:20px;text-align:center}
.chip{display:block;background:#ffd54a;color:#222;border-radius:12px;padding:8px;margin:6px 0;font-size:22px}
.score small{display:block;font-size:12px;letter-spacing:2px}
button.t0,button.t1{box-shadow:0 5px 0 #0006}

#hp{position:fixed;bottom:0;left:0;right:0;max-height:38vh;background:#0b1630ee;border-top:2px solid #ffd54a;z-index:50;padding:6px 10px;overflow:auto;font-size:14px}
#hp.min #hpb,#hp.min #hpf{display:none}#hph{font-weight:700;cursor:pointer;color:#ffd54a}
#hpf{display:flex;gap:6px;margin-top:4px}#hpf input{flex:1;margin:0}#hpf button,#hpf select{width:auto;margin:0}
.ev{padding:2px 0}.ev.t0{color:#8ab4ff}.ev.t1{color:#ff9e80}
#cl{min-height:40px}

.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.fc{position:relative;width:170px;padding:14px 10px 12px;border-radius:18px 18px 40px 40px;text-align:center;color:#2b1d00;overflow:hidden;box-shadow:0 10px 30px #000a;animation:fcin .9s cubic-bezier(.2,1.4,.4,1) both;margin:6px auto}
.fc.bronze{background:linear-gradient(160deg,#e0a672,#8a5524)}.fc.silver{background:linear-gradient(160deg,#f2f4f7,#8f9aa8)}.fc.gold{background:linear-gradient(160deg,#fff0a8,#d9a520)}.fc.star{background:linear-gradient(160deg,#7af7ff,#5b3fe0 60%,#d63fe0);color:#fff}
.fo{font-size:54px;font-weight:900;line-height:1}.fo small{display:block;font-size:12px;opacity:.8}.fn{font-size:19px;font-weight:800;margin:8px 0;border-bottom:2px solid #0004;padding-bottom:6px;word-break:break-word}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:14px;text-align:right}.fg b{font-size:18px}
.fcs{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
@keyframes fcin{from{transform:rotateY(90deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{0%{left:-60%}60%,100%{left:140%}}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 0,#2a52c455,transparent 50%),radial-gradient(circle at 90% 100%,#8e24aa55,transparent 45%)}
button{transition:transform .12s,filter .12s}button:active{transform:scale(.96)}button:hover{filter:brightness(1.12)}
.card{backdrop-filter:blur(4px);animation:cin .35s both}@keyframes cin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

.rb,.t10,.sh{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{background:#0007;border-radius:14px;padding:8px;position:relative;animation:cin .4s both}.rc>b{display:block;margin:0 0 6px;padding-inline-end:38px;font-size:15px}
.rc>button{position:absolute;top:6px;left:6px;width:34px;height:30px;padding:0;margin:0}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:5px}.rs button{margin:0;padding:9px 0;font-size:17px}
.t10 button,.sh button{margin:2px 0;padding:9px 3px;font-size:13px}
.crash{animation:crash .7s}@keyframes crash{0%{transform:translateX(-60px) scale(1.3)}50%{transform:translateX(0) scale(.7);filter:brightness(3)}100%{transform:none}}
.hit{animation:cin .5s both}

#cbtn{position:fixed;bottom:16px;left:14px;z-index:70;width:58px;height:58px;border-radius:50%;font-size:26px;padding:0;margin:0;background:linear-gradient(180deg,#3aa8ff,#1565c0);box-shadow:0 6px 18px #000a}
#cbtn i{position:absolute;top:-4px;right:-4px;background:#e53935;color:#fff;border-radius:10px;font-size:12px;padding:2px 7px;font-style:normal}
.cdr{position:fixed;left:0;right:0;bottom:0;max-height:50vh;background:#08122bf5;border-top:2px solid #ffd54a;z-index:69;padding:12px 12px 80px;display:none;border-radius:20px 20px 0 0;flex-direction:column}
.cdr.open{display:flex}.clines{overflow:auto;max-height:28vh;margin-bottom:8px;font-size:15px}
.crow{display:flex;gap:6px}.crow input{flex:1;margin:0}.crow button{width:auto;margin:0;padding:10px 14px;font-size:15px}
.lby{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;direction:ltr;margin:10px 0}
.lc{border-radius:18px;padding:8px;min-height:180px;background:#0006;text-align:center}.lc h3{margin:4px 0 8px;font-size:16px}
.lc.l0{background:linear-gradient(180deg,#2979ff55,#13469a33);border:2px solid #2979ff}.lc.l1{background:linear-gradient(180deg,#ff704355,#b23a1433);border:2px solid #ff7043}
.pc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;overflow-wrap:anywhere;background:#ffffff26;border-radius:30px;padding:6px 8px;margin:6px 0;animation:zoom .4s both;font-size:15px;word-break:break-all}
.pc.me{flex-wrap:nowrap;font-size:13px;padding:6px 4px;background:#ffd54a;color:#222;font-weight:bold;box-shadow:0 0 14px #ffd54a}
.pc .mv{flex:none;width:26px;height:26px;padding:0;margin:0;border-radius:50%;font-size:14px;box-shadow:none}
.ev{padding:2px 0}.ev.t0{color:#8ab4ff}.ev.t1{color:#ff9e80}.ev.t2{color:#ddd}

.hero{text-align:center;margin:18px 0 10px}.hero .hl{font-size:70px;animation:zoom .6s both}
.hb{display:flex;flex-direction:column;gap:14px;margin:26px 4px 120px}
.hb button{height:72px;font-size:23px;border-radius:36px;border:3px solid #0008;color:#fff;text-shadow:0 2px 0 #0006;box-shadow:0 7px 0 #0007,inset 0 6px 0 #fff4;animation:zoom .5s both}
.hb .bb1{background:linear-gradient(180deg,#26d0c0,#0c8a86)}.hb .bb2{background:linear-gradient(180deg,#6fe06f,#2b9a35);animation-delay:.08s}.hb .bb3{background:linear-gradient(180deg,#ffa63d,#e5650a);animation-delay:.16s}.hb .bb4{background:linear-gradient(180deg,#7c8cff,#3d3fb8);animation-delay:.24s;height:58px;font-size:18px}
.tabs{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(440px,92vw);display:flex;gap:6px;background:#06120fdd;border:2px solid #ffffff30;border-radius:30px;padding:6px;z-index:30;backdrop-filter:blur(8px)}
.tabs button{flex:1;margin:0;border-radius:24px;padding:8px 4px;font-size:22px;background:none;color:#fff;box-shadow:none;display:flex;flex-direction:column;align-items:center}.tabs button small{font-size:12px;font-weight:normal}.tabs button.on{background:#ffffff26}
.codes{display:flex;gap:8px;justify-content:center;direction:ltr;margin:12px 0}.codes span{width:56px;height:70px;border-radius:14px;background:#fff;color:#111;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #aaa;animation:zoom .5s both}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{margin:4px 0;font-size:15px;padding:12px 6px}
.rm{background:linear-gradient(180deg,#3aa882,#237a5c);color:#fff;box-shadow:0 5px 0 #14503b}

.ev.t2{color:#555}.ev.t0{color:#1a62d0}.ev.t1{color:#e0561a}

/* ---------- كلمة السر: تلميح واحد، 30 ثانية، الدور بالتبادل ---------- */
function passOrder(){const cy=S.two?2:3,o=[];for(let c=0;c<cy;c++)for(let p=0;p<(S.two?2:1);p++)[start(),1-start()].forEach(t=>o.push([t,p]));return o}
function badClue(clue,w){const c=clue.trim();if(!c)return"اكتب التلميح";if(/\s/.test(c))return"التلميح أكتر من كلمة";const norm=x=>x.replace(/[ًٌٍَُِّْ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/^ال/,"");const cn=norm(c);if(cn.length>=3&&w.split(/\s+/).some(t=>{const tn=norm(t);return tn.length>=3&&(tn.includes(cn)||cn.includes(tn))}))return"التلميح فيه اسم اللاعب";return""}
function pass(n){const order=passOrder();if(n>=order.length)return endSeg();const [team,pi]=order[n];const T=S.teams[team],O=S.teams[1-team];const giver=T.players[pi];const po=drawTier(PEOPLE,'pw:'),w=po.n;
R(`${hostTag}<h2>🔑 كلمة السر (${n+1}/${order.length})</h2>${scoreBar(team)}<div class="card"><div class="big">دور <b>${esc(giver)}</b> من ${esc(T.name)}.<br>الحكم يُظهر الكلمة له وحده، ويكتب تلميحاً من <b>كلمة واحدة فقط</b> بدون اسم اللاعب أو النادي أو اللقب. معه 30 ثانية ليكتب والفريق يجاوب.</div>${revealBox("🤫 الكلمة السرية: <b>"+esc(w)+"</b><br><small>"+po.t+" · "+DL[po.d]+"</small>","👁 اعرض الكلمة")}</div><button id="go2">▶ ابدأ (30 ثانية)</button>`);bindReveal();

function clock(s,onZero){const set=()=>{const e=document.getElementById("tm");if(e){e.textContent=s;e.className="timer"+(s<=10?" low":"")}};set();timer=setInterval(()=>{s--;set();if(s<=10&&s>0)sfx.tick();if(s<=0){stop();sfx.no();buzz(300);onZero()}},1000)}
function nextBtn(msg){const c=document.getElementById("ab");c.innerHTML=`<div class="big">${msg}</div><button id="nx">التالي</button>`;on("nx",()=>pass(n+1))}
function play(){let clue=null,done=false;
R(`${hostTag}<h2>🔑 ${esc(giver)} — ${esc(T.name)}</h2>${scoreBar(team)}<div class="card"><div class="timer" id="tm">30</div>${revealBox("🤫 <b>"+esc(w)+"</b><br><small>"+po.t+" · "+DL[po.d]+"</small>","👁 الكلمة")}<div id="cb"><input id="ci" placeholder="التلميح: كلمة واحدة فقط" autocomplete="off"><button id="cs">إرسال التلميح</button><div class="small" id="er"></div></div><div id="ab"></div></div>`);bindReveal();

on("g1",()=>{if(done)return;done=true;stop();add(team,3);pass(n+1)});on("g2",()=>{if(done)return;done=true;stop();steal(clue,"إجابة غلط")});on("g3",()=>{if(done)return;done=true;stop();steal(clue,"التلميح مخالف")})});

function who(n){if(n>=6)return endSeg();const turn=(start()+n)%2;const p0=draw(WHO,x=>x.a);const p=(()=>{const hs=p0.h.slice(0,-1);const last=p0.h[p0.h.length-1];const isB=x=>/ولد|مولود|عام \d{4}|سنة \d{4}/.test(x);const b=hs.filter(isB),o=hs.filter(x=>!isB(x));for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}const r=[...o];b.forEach(x=>r.splice(Math.min(r.length,1+Math.floor(Math.random()*3)),0,x));return{a:p0.a,h:[...r,last]}})();let k=1;

on("ok",()=>{add(turn,pts);paint(true)});on("mo",()=>{k++;sfx.tick();paint()});on("gv",()=>paint(true))}

/* ---------- 3 في 1 ---------- */
function three(n){if(n>=3)return endSeg();const it=draw(T3,x=>x.k);let turn=(start()+n)%2,miss=0,got=0;
function paint(msg){R(`${hostTag}<h2>3️⃣ 3 في 1 (${n+1}/3)</h2>${scoreBar(turn)}<div class="small">${msg||"اذكروا لاعباً واحداً يجمع الصفات الثلاث. ممنوع التكرار."}</div><div class="card"><div class="big q">${it.c.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div><div class="small">دور ${esc(S.teams[turn].name)} — ${ld(S.teams[turn])}</div>${revealBox("أمثلة: "+esc(it.a)+"<br><small>الحكم يقبل أي لاعب صحيح غيرها</small>")}<button class="good" id="y">✅ صح +1</button><button class="bad" id="no">❌ غلط (الدور للفريق الآخر)</button><button class="sec" id="sk">⏭ إنهاء هذا الكارت</button>`);bindReveal();

function bell(n){BK=null;BP=null;if(n>=8)return endSeg();const it=draw(GEN,x=>x.k);let locked=-1,tried=[];

if(locked<0){const press=i=>{if(tried.includes(i))return;locked=i;BK=null;BP=null;if(AUTO)CURQ={id:Date.now(),turn:i,ans:it.a,open:1};sfx.go();buzz(120);paint()};if(ONLINE){BK=n+"-"+Date.now().toString(36);BP=press}on("b0",()=>press(0));on("b1",()=>press(1));on("skp",()=>{BK=null;BP=null;bell(n+1)});keyH=e=>{const k=e.key.toLowerCase();if(k==="a")press(0);if(k==="l")press(1)}}

paint()}

function rate(s){const m=s.m||0,a=s.a||0,c=s.c||0;
const acc=cl(35+64*((c+2)/(a+4))),avg=s.tn?s.ts/s.tn:null,spd=avg==null?55:cl(99-2.6*avg),
win=cl(35+64*(((s.w||0)+1)/(m+2))),kno=cl(35+c*1.6),seg=cl(35+64*(((s.sw||0)+1)/(m*3+2))),bel=cl(35+(s.b||0)*6);

const _judge=judge;judge=function(o){DBLNOW=false;const r=o.onRes;o.onRes=(...a)=>{try{r(...a)}finally{DBLNOW=false}};_judge(o);if(!o.nodbl)addDbl()};
/* ---- بنك: 60 ثانية ---- */
function bank(n){clearInterval(_bt);if(n>=4)return endSeg();const t=(start()+n)%2;
R(`${hostTag}<h2>🏦 بنك (${n+1}/4)</h2>${scoreBar(t)}<div class="card"><div class="big">دور ${esc(S.teams[t].name)}: 60 ثانية، أسئلة تتبادلوها بين اللاعبين. كل إجابة صح تزيد السلسلة لكنها ما تتحسبش إلا لو ضغط زميلك "بنك" خلال 4 ثواني. أي غلط أو خلص الوقت يضيّع غير المحفوظ. الفريق التاني يتفرج.</div></div><button id="st">▶ ابدأ الـ60 ثانية</button>`);
on("st",()=>{let left=60,c=0,qi=0,end=false,wait=null;const tick=()=>{const e=document.getElementById("bt");if(e)e.textContent=left+"s ⏱";if(left<=10&&left>0)sfx.tick()};
const bar=()=>{app.insertAdjacentHTML("afterbegin",`<div class="timer" id="bt">${left}s ⏱</div>`)};
_bt=setInterval(()=>{left--;tick();if(left<=0){clearInterval(_bt);end=true;c=0;sfx.no();buzz(300);if(wait){clearTimeout(wait);fin()}}},1000);
const fin=()=>{clearInterval(_bt);R(`${hostTag}<h2>🏦 انتهى وقت ${esc(S.teams[t].name)}</h2>${scoreBar(t)}<div class="big">السلسلة غير المحفوظة ضاعت</div><button id="nx">التالي</button>`);on("nx",()=>bank(n+1))};
const q=()=>{if(end)return fin();const pi=qi%S.teams[t].players.length;const it=draw(MCQ.filter(x=>x.d===(qi<3?1:qi<6?2:3)),x=>x.k);
judge({title:`🏦 بنك — دور ${esc(S.teams[t].players[pi])} · السلسلة ${c}`,turn:t,q:it.q,opts:it.o,ans:it.c,secs:0,streak:0,nodbl:1,onRes:ok=>{if(end)return fin();if(!ok){c=0;qi++;return q()}c+=LAD[Math.min(qi,LAD.length-1)];qi++;
R(`${hostTag}<h2>🏦 بنك</h2>${scoreBar(t)}<div class="card"><div class="big">السلسلة: <b>${c}</b></div><div class="small">زميله عنده 4 ثواني ليضغط بنك</div></div><button class="good" id="bk" style="height:100px;font-size:24px">🏦 بنك (احفظ ${c})</button><div class="bar"><i id="b4" style="width:100%;transition:width ${ONLINE?7:4}s linear"></i></div>`);BNK=t;bar();setTimeout(()=>{const b=document.getElementById("b4");if(b)b.style.width="0"},50);
wait=setTimeout(()=>{wait=null;BNK=null;q()},ONLINE?7000:4000);on("bk",()=>{clearTimeout(wait);wait=null;BNK=null;add(t,c);c=0;if(end)return fin();q()})}});app.insertAdjacentHTML("afterbegin",`<div class="timer" id="bt">${left}s ⏱</div>`)};
q()})}
/* ---- أحلى عشرة ---- */
function top10(n){const L=draw(TOP10,x=>x.t);const names=L.l;let got=Array(13).fill(-1),turn=start(),pl=[0,0],pass=[0,0],tl=15;
const sc=r=>r<10?r+1:-(13-r-1)-0;const pts=r=>r<10?10-r:-(3-(r-10));
const next=()=>{turn=1-turn};

const paint=()=>{if(done())return fin();R(`${hostTag}<h2>🔟 أحلى عشرة</h2>${scoreBar(turn)}<div class="small">${esc(L.t)}</div><div class="small">دور ${esc(S.teams[turn].name)} — ${esc(S.teams[turn].players[pl[turn]%S.teams[turn].players.length])} · 15 ثانية · تخطي ${pass[turn]}/3</div><div class="timer" id="tm">15</div><div class="t10">${names.map((nm,i)=>`<button id="t${i}" class="${got[i]>=0?"t"+got[i]:"sec"}" ${got[i]>=0?"disabled":""}><b>${i+1}</b> ${got[i]>=0?esc(nm)+" ("+(pts(i)>0?"+":"")+pts(i)+")":`?<span class="reveal hn" style="display:none;background:none;padding:0;margin-inline-start:6px">${esc(nm)}</span>`}</button>`).join("")}</div><button class="bad" id="no">❌ خارج القائمة (صفر ويتخطى)</button><button class="sec" id="hv">👁 أسماء للحكم</button><button class="sec" id="fin">⏹ انتهى</button><button class="sec" id="fl">🚩 سؤال فيه مشكلة</button><div class="small">المصدر: ${esc(L.u)}</div>`);
if(AUTO){CURQ={id:Date.now(),turn,open:true,t10:names,got};["no","hv","fin"].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display="none"})}
gclock(15,()=>{pass[turn]++;pl[turn]++;next();paint()});
on("hv",()=>document.querySelectorAll(".hn").forEach(e=>e.style.display=e.style.display==="none"?"inline":"none")); names.forEach((_,i)=>on("t"+i,()=>{got[i]=turn;add(turn,pts(i));pl[turn]++;next();paint()}));
on("no",()=>{pass[turn]++;pl[turn]++;next();paint()});on("fin",fin);on("fl",()=>{const f=JSON.parse(localStorage.getItem("flags")||"[]");f.push(L.t);localStorage.setItem("flags",JSON.stringify(f));alert("اتسجل")})};
const fin=()=>{stop();R(`${hostTag}<h2>🔟 النتيجة</h2>${scoreBar(-1)}<div class="card">${names.map((x,i)=>`<div class="${got[i]>=0?"t"+got[i]:""}">${i+1}. ${esc(x)}</div>`).join("")}</div><button id="nx">التالي</button>`);on("nx",()=>endSeg())};
paint()}
/* ---- الحلبة ---- */
const HP=["لاعب لعب لريال مدريد وبرشلونة","لاعب فاز بكأس العالم","لاعب فاز بالكرة الذهبية","هداف في الدوري الإنجليزي","حارس مرمى مشهور","مدرب فاز بدوري أبطال أوروبا","لاعب مصري محترف في أوروبا","لاعب لعب في الدوري الإيطالي","لاعب لعب لليفربول","لاعب لعب لمانشستر يونايتد","لاعب أفريقي مشهور","مدافع مشهور","لاعب وسط مشهور","لاعب لعب لباريس سان جيرمان","لاعب لعب لبايرن ميونخ","لاعب لعب لتشيلسي","لاعب لعب لأرسنال","لاعب لعب ليوفنتوس","لاعب لعب لميلان","لاعب لعب للأهلي المصري","لاعب لعب للزمالك","لاعب برازيلي","لاعب أرجنتيني","لاعب فرنسي","لاعب إسباني","لاعب ألماني","لاعب إنجليزي","لاعب برتغالي","لاعب هولندي","لاعب عربي مشهور","لاعب شارك في كأس العالم 2022","لاعب سجل هاتريك","لاعب لعب لمانشستر سيتي","لاعب لعب لأتلتيكو مدريد","لاعب لعب لإنتر ميلان","لاعب لعب لتوتنهام","لاعب لعب لدورتموند","لاعب فاز بدوري أبطال أفريقيا","لاعب لعب في الدوري السعودي","لاعب لعب لنابولي أو روما"];

const p=draw(HP,x=>x);let tl=10,v=["",""];
R(`${hostTag}<h2>⚔️ الحلبة ${sd?"(حاسم)":`(${n+1}/${tot})`}</h2>${scoreBar(-1)}<div class="card"><div class="big q">${esc(p)}</div><div class="small">كل فريق يكتب اسم لاعب (القائد يكتب). لو الاسمين نفس الاسم يتصادموا ويتلغوا. الاسم الصح الفريد = نقطة.</div><div class="timer" id="tm">10</div><div class="row">${[0,1].map(i=>`<div><div class="small">${esc(S.teams[i].name)}</div><input type="password" id="v${i}" autocomplete="off" placeholder="اكتب هنا"></div>`).join("")}</div></div><button id="rv2">👁 كشف</button>`);
let go=false;const reveal=()=>{if(go)return;go=true;stop();v=[0,1].map(i=>document.getElementById("v"+i).value.trim());const nz=s=>s.replace(/[ًٌٍَُِّْ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").toLowerCase();
const same=v[0]&&nz(v[0])===nz(v[1]);
R(`${hostTag}<h2>⚔️ الكشف</h2>${scoreBar(-1)}<div class="card"><div class="small">${esc(p)}</div><div class="row">${[0,1].map(i=>`<div class="${same?"crash":"hit"} t${i}"><div class="small">${esc(S.teams[i].name)}</div><div class="big">${esc(v[i]||"—")}</div></div>`).join("")}</div>${same?`<div class="big" style="color:#ff5252">💥 تصادم! الاسمين اتلغوا</div>`:""}</div>${same?"":`<div class="row">${[0,1].map(i=>`<button class="good" id="y${i}" ${v[i]?"":"disabled"}>✅ ${esc(S.teams[i].name)} صح</button>`).join("")}</div>`}<button id="nx">التالي</button>`);
if(same){sfx.no();buzz([100,50,100])}let fin=false;if(!same)[0,1].forEach(i=>on("y"+i,()=>{if(fin)return;fin=true;add(i,1);document.getElementById("y"+i).disabled=true}));
on("nx",()=>sd?(S.teams[0].score===S.teams[1].score?halba(n,true):endSeg()):halba(n+1))};
on("rv2",reveal);gclock(10,reveal)}

function passA(n){const order=passOrder();if(n>=order.length)return endSeg();const [team,pi]=order[n];const T=S.teams[team],O=S.teams[1-team];const solo=T.players.length<2;const giver=solo?O.players[0]:T.players[pi];const po=drawTier(PEOPLE,'pw:'),w=po.n;
const nxt=()=>{stop();CURQ=null;timer=setInterval(()=>{stop();passA(n+1)},4500)};
const scr=h=>R(`${hostTag}<h2>🔑 كلمة السر (${n+1}/${order.length})</h2>${scoreBar(team)}${h}`);
const steal=(clue,reason)=>{if(solo){scr(`<div class="card"><div class="small">${esc(reason)}</div><div class="big">الكلمة كانت: ${esc(w)}</div></div>`);return nxt()}
scr(`<div class="small">${esc(reason)}</div><div class="card"><div class="chip">💡 ${esc(clue)}</div><div class="timer" id="tm">30</div><div class="big">${esc(O.name)} يكتبوا التخمين على موبايلاتهم</div></div>`);
CURQ={id:Date.now(),turn:1-team,open:true,ph:"guess",g:null,ans:w,onok:()=>{stop();add(1-team,2);scr(`<div class="card"><div class="big">🎉 ${esc(w)} (+2 ${esc(O.name)})</div></div>`);nxt()}};
gclock(30,()=>{CURQ=null;scr(`<div class="card"><div class="big">⏰ الكلمة كانت: ${esc(w)}</div></div>`);nxt()})};
scr(`<div class="card"><div class="big">دور <b>${esc(giver)}</b>. الكلمة ظاهرة على موبايله بس، يكتب تلميح من كلمة واحدة${solo?` وفريق ${esc(T.name)} يخمن`:""}.</div><div class="timer" id="tm">30</div></div>`);
CURQ={id:Date.now(),turn:solo?1-team:team,open:true,ph:"clue",g:giver,w,onclue:v=>{const bad=badClue(v,w);if(bad==="اكتب التلميح")return;stop();if(bad){CURQ=null;return steal(v.trim(),bad+" — الدور يروح للفريق الثاني")}
const clue=v.trim();scr(`<div class="card"><div class="chip">💡 ${esc(clue)}</div><div class="timer" id="tm">30</div><div class="big">${esc(T.name)} يكتبوا التخمين على موبايلاتهم</div></div>`);
CURQ={id:Date.now(),turn:team,open:true,ph:"guess",g:solo?null:giver,ans:w,onok:()=>{stop();add(team,3);scr(`<div class="card"><div class="big">🎉 ${esc(w)} (+3 ${esc(T.name)})</div></div>`);nxt()}};
gclock(30,()=>steal(clue,"خلص الوقت"))}};
gclock(30,()=>{CURQ=null;scr(`<div class="card"><div class="big">⏰ مفيش تلميح، الكلمة كانت: ${esc(w)}</div></div>`);nxt()})}
function halbaA(n,sd){const tot=10;if(!sd&&n>=tot){const[a,b]=S.teams;if(a.score===b.score)return halbaA(n,true);return endSeg()}
const p=draw(HP,x=>x);const KN=[...PEOPLE.map(x=>x.n),...WHO.map(x=>x.a),...TOP10.flatMap(x=>x.l)];const valid=v=>v&&KN.some(k=>mt(k,v)&&nz(v).length>=3);
R(`${hostTag}<h2>⚔️ الحلبة ${sd?"(حاسم)":`(${n+1}/${tot})`}</h2>${scoreBar(-1)}<div class="card"><div class="big q">${esc(p)}</div><div class="small">أي لاعب في كل فريق يكتب اسم لاعب على موبايله. أول إجابة من الفريق هي اللي تتحسب. نفس الاسم = تصادم.</div><div class="timer" id="tm">15</div></div>`);
let done=false;const fin=()=>{if(done)return;done=true;stop();const v=(CURQ&&CURQ.vals)||["",""];CURQ=null;const same=v[0]&&v[1]&&nz(v[0])===nz(v[1]);const ok=[0,1].map(i=>!same&&valid(v[i]));ok.forEach((o,i)=>{if(o)add(i,1)});
R(`${hostTag}<h2>⚔️ الكشف</h2>${scoreBar(-1)}<div class="card"><div class="small">${esc(p)}</div><div class="row">${[0,1].map(i=>`<div class="t${i}"><div class="small">${esc(S.teams[i].name)}</div><div class="big">${esc(v[i]||"—")}</div><div class="small">${same?"💥 تصادم":ok[i]?"✅ +1":v[i]?"❌ الاسم مش في قائمة اللاعبين":"—"}</div></div>`).join("")}</div></div>`);
if(same){sfx.no();buzz([100,50,100])}timer=setInterval(()=>{stop();sd?(S.teams[0].score===S.teams[1].score?halbaA(n,true):endSeg()):halbaA(n+1)},5000)};
CURQ={id:Date.now(),both:true,turn:-1,open:true,vals:["",""],reveal:fin};gclock(15,fin)}

function passB(n){if(n>=4)return endSeg();const po=drawTier(PEOPLE,'pw:'),w=po.n;const kn=S.teams.map(t=>t.players[n%t.players.length]);
const clues=[null,null],blk=[false,false];
const nxt=()=>{stop();CURQ=null;timer=setInterval(()=>{stop();passB(n+1)},4500)};
const scr=(extra)=>R(`${hostTag}<h2>🔑 كلمة السر (${n+1}/4)</h2>${scoreBar(-1)}<div class="card"><div class="small">اللي عارفين الكلمة دلوقتي: <b>${esc(kn[0])}</b> (${esc(S.teams[0].name)}) و <b>${esc(kn[1])}</b> (${esc(S.teams[1].name)}). كل واحد يكتب تلميح من كلمة واحدة لزمايله. التلميحين ظاهرين للكل.</div>${extra}</div>`);
const clueHtml=()=>[0,1].map(i=>`<div class="chip t${i}">💡 ${esc(S.teams[i].name)}: ${clues[i]===null?"...":blk[i]?"❌ تلميح مخالف":esc(clues[i])}</div>`).join("");
const guessPhase=()=>{stop();if(!clues.some((c,i)=>c!==null&&!blk[i])){CURQ=null;scr(`<div class="big">مفيش تلميح صالح. الكلمة كانت: ${esc(w)}</div>`);return nxt()}
scr(`${clueHtml()}<div class="timer" id="tm">30</div><div class="big">باقي اللاعبين يكتبوا التخمين. أول فريق يجاوب صح ياخد +3</div>`);
CURQ={id:Date.now(),ph:"guess2",open:true,turn:-1,g:kn,blk,ans:w,win:t=>{stop();add(t,3);scr(`${clueHtml()}<div class="big">🎉 ${esc(w)} (+3 ${esc(S.teams[t].name)})</div>`);nxt()}};
gclock(30,()=>{CURQ=null;scr(`${clueHtml()}<div class="big">⏰ الكلمة كانت: ${esc(w)}</div>`);nxt()})};
scr(`<div class="timer" id="tm">25</div><div id="cls">${clueHtml()}</div>`);
const upd=()=>{const c=document.getElementById("cls");if(c)c.innerHTML=clueHtml()};

/* ---- سكور شيت ---- */
function sheet(n){const M=draw(LU,x=>x.t);const pl=[];M.teams.forEach((t,ti)=>t.p.forEach(x=>pl.push({n:x[1],pos:x[0],ti,got:-1})));
let turn=start(),pi=[0,0],strikes={},out={};const key=(t,i)=>t+"_"+i;const who=t=>S.teams[t].players[pi[t]%S.teams[t].players.length];
const alive=t=>S.teams[t].players.some((_,i)=>(strikes[key(t,i)]||0)<3);
const nextTurn=()=>{pi[turn]++;let t=1-turn;if(!alive(t))t=turn;turn=t};
const paint=()=>{if(pl.every(x=>x.got>=0)||(!alive(0)&&!alive(1)))return fin();while(!alive(turn))turn=1-turn;
R(`${hostTag}<h2>📋 سكور شيت</h2>${scoreBar(turn)}<div class="small">${esc(M.t)}</div><div class="small">دور ${esc(who(turn))} (${esc(S.teams[turn].name)}) · 15 ثانية · أخطاء: ${strikes[key(turn,pi[turn]%S.teams[turn].players.length)]||0}/3</div><div class="timer" id="tm">15</div><div class="sh">${M.teams.map((t,ti)=>`<div><b>${esc(t.n)}</b>${pl.map((x,i)=>x.ti===ti?`<button id="p${i}" class="${x.got>=0?"t"+x.got:"sec"}" ${x.got>=0?"disabled":""}>${x.got>=0?esc(x.n):x.pos+`<span class="reveal hn" style="display:none;background:none;padding:0;margin-inline-start:4px">${esc(x.n)}</span>`}</button>`:"").join("")}</div>`).join("")}</div><button class="sec" id="hv">👁 أسماء للحكم</button><button class="bad" id="st">❌ خطأ / مكرر / خارج الوقت (ضربة)</button><button class="sec" id="fin">⏹ انتهى</button><div class="small">المصدر: ${esc(M.u)}</div>`);
const strike=()=>{const k=key(turn,pi[turn]%S.teams[turn].players.length);strikes[k]=(strikes[k]||0)+1;sfx.no();nextTurn();paint()};
gclock(15,strike);on("hv",()=>document.querySelectorAll(".hn").forEach(e=>e.style.display=e.style.display==="none"?"inline":"none"));pl.forEach((x,i)=>on("p"+i,()=>{x.got=turn;add(turn,1);nextTurn();paint()}));on("st",strike);on("fin",fin)};
const fin=()=>{stop();R(`${hostTag}<h2>📋 النتيجة</h2>${scoreBar(-1)}<div class="card">${M.teams.map((t,ti)=>`<b>${esc(t.n)}</b><div>${pl.filter(x=>x.ti===ti).map(x=>`<span class="chip ${x.got>=0?"t"+x.got:""}">${esc(x.n)}</span>`).join("")}</div>`).join("")}</div><button id="nx">التالي</button>`);on("nx",()=>endSeg())};
paint()}

FN.top10=()=>top10(0);FN.halba=()=>AUTO?halbaA(0):halba(0);FN.pass=()=>AUTO?(S.two?passB(0):passA(0)):pass(0);FN.sheet=()=>sheet(0);

boot();
